name: Validate castle exploration
on:
  pull_request:
permissions:
  contents: read
jobs:
  castle-exploration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test && npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Delivered-input matrix
        run: |
          npm run dev -- --port 4317 --strictPort > /tmp/exploration-server.txt 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for n in $(seq 1 30); do curl -fs http://127.0.0.1:4317 >/dev/null && break || sleep 1; done
          node scripts/phase3e-browser.mjs
          node scripts/phase3e-evidence.mjs
          node scripts/phase3h-preservation.mjs
          node scripts/phase3e-safety.mjs
          node scripts/phase3e-negative.mjs
          node scripts/phase3e-async.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3e-${{ github.event.pull_request.head.sha }}
          path: evidence/phase3e
          if-no-files-found: error
          retention-days: 30
