name: Validate connected defences
on:
  pull_request:
permissions:
  contents: read
jobs:
  connected-defences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test && npm run build
      - run: node scripts/phase3d-geometry-check.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Actual browser matrix
        run: |
          npm run dev -- --port 4317 --strictPort > /tmp/phase3d-server.txt 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for n in $(seq 1 30); do curl -fs http://127.0.0.1:4317 >/dev/null && break || sleep 1; done
          node scripts/phase3d-browser.mjs
          node scripts/phase3d-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3d-current-head
          path: |
            evidence/phase3d/browser/
            production/phase3d/geometry-report.json
