name: 'West gate left door: delivered browser restoration'
on:
  pull_request:
    paths:
      - 'src/main.js'
      - 'src/west-gate-door-inspection.js'
      - 'scripts/west-gate-door-browser.mjs'
      - '.github/workflows/west-gate-left-door.yml'
permissions:
  contents: read
concurrency:
  group: west-gate-left-door-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  delivered-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned Playwright browsers
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise actual fixed camera focus and restoration
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/west-gate-left-door/ci
          npm run dev -- --port 4317 --strictPort >evidence/west-gate-left-door/ci/vite.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=false
          for n in $(seq 1 30); do
            if curl -fs http://127.0.0.1:4317 >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then cat evidence/west-gate-left-door/ci/vite.log; exit 1; fi
          node scripts/west-gate-door-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: west-gate-left-door-browser
          path: evidence/west-gate-left-door/ci/
          if-no-files-found: warn
