name: Stage 3-B castle overview
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/stage3b-overview-generate.mjs --verify
      - run: node scripts/stage3b-preservation-check.mjs
      - run: python3 scripts/stage3b-independent-oracle.py
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: git diff --check
      - run: npm run build
      - name: Browser matrix and evidence
        run: |
          mkdir -p evidence-run/stage3b
          git rev-parse HEAD > evidence-run/stage3b/HEAD.txt
          git rev-parse HEAD^{tree} > evidence-run/stage3b/tree.txt
          npm run dev -- --port 4393 > /tmp/stage3b-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4393/ >/dev/null && break; sleep 1; done
          TEST_URL=http://127.0.0.1:4393 EVIDENCE_DIR=evidence-run/stage3b node scripts/stage3b-overview-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3b-overview-${{ github.sha }}
          path: evidence-run/stage3b
          if-no-files-found: error
