name: Phase I controlled H I performance
on:
  pull_request:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Same host H and I cold and warm trials
        run: |
          set -euo pipefail
          git worktree add --detach ../phase-i-baseline 42ed7bbe1b1f839535ed66c76c75d1ade2ce2cc8
          (cd ../phase-i-baseline && npm ci)
          cp scripts/phase3i-performance.mjs ../phase-i-baseline/scripts/
          (cd ../phase-i-baseline && npm run dev -- --port 4382 --strictPort) >/tmp/h-server.log 2>&1 &
          h=$!
          npm run dev -- --port 4381 --strictPort >/tmp/i-server.log 2>&1 &
          i=$!
          trap 'kill "$h" "$i" 2>/dev/null || true' EXIT
          for port in 4381 4382; do
            for n in $(seq 1 30); do curl -fs http://127.0.0.1:$port >/dev/null && break || sleep 1; done
          done
          mkdir -p evidence/phase3i/ci-comparison
          (cd ../phase-i-baseline && LABEL=H URL=http://127.0.0.1:4382 OUT=evidence/phase3i/performance-H.json node scripts/phase3i-performance.mjs)
          cp ../phase-i-baseline/evidence/phase3i/performance-H.json evidence/phase3i/ci-comparison/
          LABEL=I OUT=evidence/phase3i/ci-comparison/performance-I.json node scripts/phase3i-performance.mjs
          node scripts/phase3i-performance-report.mjs evidence/phase3i/ci-comparison/performance-H.json evidence/phase3i/ci-comparison/performance-I.json "$(git rev-parse HEAD)" "$(sha256sum src/main.js | cut -d' ' -f1)" > evidence/phase3i/ci-comparison/verified-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3i-comparison-${{ github.event.pull_request.head.sha }}
          path: evidence/phase3i/ci-comparison
          if-no-files-found: error
