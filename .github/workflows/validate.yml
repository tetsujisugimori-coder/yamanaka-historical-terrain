name: Validate prototype
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  landscape-1590:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify scenery, fixed eyes, comparison, fallback and negative controls
        run: |
          npm run dev -- --port 4317 --strictPort > /tmp/landscape-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317 > /dev/null; then break; fi
            sleep 1
          done
          export LANDSCAPE_EVIDENCE="evidence/landscape/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/landscape-browser.mjs
          node scripts/landscape-picking.mjs
          node scripts/landscape-reset-cancel.mjs
          node scripts/landscape-reset-cancel.mjs --remove-label-restore
          node scripts/landscape-browser.mjs --mutation=drama
          node scripts/landscape-browser.mjs --mutation=ground
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-1590-evidence
          path: evidence/landscape/
          if-no-files-found: error
  fixed-sections:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Compare sections to independent raw GLB oracle and exercise gated races
        run: |
          npm run dev -- --port 4317 --strictPort > /tmp/sections-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317 > /dev/null; then break; fi
            sleep 1
          done
          export SECTION_EVIDENCE="evidence/sections/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/sections-evidence.mjs
          node scripts/sections-browser.mjs
          node scripts/sections-pending.mjs
          export SECTION_REVIEW_EVIDENCE="$SECTION_EVIDENCE/review-fixes"
          node scripts/sections-cancel-browser.mjs
          node scripts/sections-cancel-browser.mjs --remove-presentation-restore
          node scripts/sections-labels-browser.mjs
          node scripts/sections-browser.mjs --mutation=height
          node scripts/sections-browser.mjs --mutation=coordinate
          node scripts/sections-browser.mjs --mutation=double
          node scripts/sections-summary.mjs
          node scripts/sections-summary-controls.mjs
          GITHUB_PAGES=1 npm run build
          npx vite preview --host 127.0.0.1 --port 4320 --strictPort --base /yamanaka-historical-terrain/ > /tmp/sections-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$server_pid" "$preview_pid"' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4320/yamanaka-historical-terrain/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/sections-subpath.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-sections-evidence
          path: evidence/sections/
          if-no-files-found: error
  data-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser:
    # Playwright 1.56.1 ships Ubuntu 24.04 builds; moving latest is now 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run browser regression, phase2A operations and negative controls
        run: |
          npm run dev -- --port 4317 --strictPort > /tmp/yamanaka-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-test.mjs
          node scripts/interaction-cycles.mjs
          node scripts/fallback-test.mjs
          node scripts/phase2a-browser.mjs
          node scripts/phase2a-fallback.mjs
          node scripts/phase2a-fallback.mjs --negative-control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            evidence/browser-results.json
            evidence/interaction-cycles.json
            evidence/fallback-results.json
            evidence/fallback/*.png
            evidence/browser/*.png
            evidence/phase2a/browser.json
            evidence/phase2a/fallback.json
            evidence/phase2a/negative-controls.json
            evidence/phase2a/browser/*.png
          if-no-files-found: error
  initial-camera:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Initial real-GLB completion after trusted camera input
        run: |
          npm run dev -- --port 4317 --strictPort > /tmp/initial-camera-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/initial-camera-browser.mjs --label=fixed
          node scripts/initial-camera-browser.mjs --label=mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-camera-evidence
          path: evidence/initial-camera/
          if-no-files-found: error
  review-fixes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Gated real-GLB intent, height and mutation checks
        run: |
          npm run dev -- --port 4317 --strictPort > /tmp/review-fixes-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/review-fixes-browser.mjs
          node scripts/review-fixes-browser.mjs --mutation=intent
          node scripts/review-fixes-browser.mjs --mutation=height
          node scripts/review-reset-cancel.mjs
          node scripts/review-reset-cancel.mjs --remove-reset-commit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-fixes-evidence
          path: evidence/review-fixes/
          if-no-files-found: error
