name: Validate prototype
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  data-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser:
    # Playwright 1.56.1 ships Ubuntu 24.04 builds; moving latest is now 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run browser regression, phase2A operations and negative controls
        run: |
          npm run dev -- --port 4317 --strictPort > /tmp/yamanaka-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-test.mjs
          node scripts/interaction-cycles.mjs
          node scripts/fallback-test.mjs
          node scripts/phase2a-browser.mjs
          node scripts/phase2a-fallback.mjs
          node scripts/phase2a-fallback.mjs --negative-control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            evidence/browser-results.json
            evidence/interaction-cycles.json
            evidence/fallback-results.json
            evidence/fallback/*.png
            evidence/browser/*.png
            evidence/phase2a/browser.json
            evidence/phase2a/fallback.json
            evidence/phase2a/negative-controls.json
            evidence/phase2a/browser/*.png
          if-no-files-found: error
