name: Stage 3-B3 survey correspondence evidence
on:
  push:
    branches: ['feat/stage3b3-survey-correspondence']
  pull_request:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture source before checks
        run: |
          mkdir -p evidence-run/stage3b3/source evidence-run/stage3b3/temp
          git show -s --format='HEAD=%H%nTREE=%T%nPARENTS=%P' > evidence-run/stage3b3/identity.txt
          uname -a > evidence-run/stage3b3/environment.txt
          node --version >> evidence-run/stage3b3/environment.txt
          df -B1 . >> evidence-run/stage3b3/environment.txt
          df -i . >> evidence-run/stage3b3/environment.txt
          cp --parents scripts/stage3b3-evidence.mjs tests/stage3b3-evidence.test.mjs scripts/stage3b-preservation-check.mjs scripts/stage3b2-evidence.mjs research/stage3b3/*.json research/stage3b2/*.json research/stage3b2/*.geojson research/stage3b/preserved-inputs.json public/data/castle-overview.json docs/stage3b3/*.md .github/workflows/stage3b3-evidence.yml AGENTS.md package.json package-lock.json evidence-run/stage3b3/source/
      - name: Survey gate and semantic fault controls
        run: |
          export TMPDIR="$PWD/evidence-run/stage3b3/temp"
          node --test tests/stage3b3-evidence.test.mjs > evidence-run/stage3b3/tests.tap
          node scripts/stage3b3-evidence.mjs > evidence-run/stage3b3/result.json
          node scripts/stage3b2-evidence.mjs > evidence-run/stage3b3/b2-regression.json
          node scripts/stage3b-preservation-check.mjs > evidence-run/stage3b3/protection.json
          git diff --exit-code 7ef4bd6a77ea0447ee0862af5b3677ac34389367 -- production public src data research/stage3b research/stage3b2
      - name: Manifest even on failure
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('evidence-run/stage3b3')
          rows=[{'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()]
          (root/'manifest.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3b3-evidence-${{ github.sha }}
          path: evidence-run/stage3b3
          include-hidden-files: true
          if-no-files-found: error
